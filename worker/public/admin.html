<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#ffffff" />
<meta name="color-scheme" content="light" />
<title>License Guard · 授权管理</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --border-strong: #cfd5dd;
    --text: #1c2024;
    --text-dim: #6b7480;
    --brand: #2563eb;
    --brand-soft: #eff4ff;
    --ok: #15803d;
    --ok-soft: #ecfdf3;
    --warn: #b45309;
    --warn-soft: #fffaeb;
    --danger: #b42318;
    --danger-soft: #fef3f2;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;   /* iOS 横屏时不要自动放大字号 */
    text-size-adjust: 100%;
  }
  a { color: var(--brand); }

  /* ---------- 登录 ---------- */
  #login {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background: var(--bg);
  }
  #login .card {
    width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px; box-shadow: 0 12px 32px rgba(16,24,40,.08);
  }
  #login h1 { margin: 0 0 4px; font-size: 19px; }
  #login p { margin: 0 0 20px; color: var(--text-dim); font-size: 13px; }

  /* ---------- 布局 ---------- */
  header.top {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 0 22px; height: 56px;
    display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 20;
  }
  header.top .logo { font-weight: 650; letter-spacing: -.2px; }
  header.top .spacer { flex: 1; }
  header.top .who { color: var(--text-dim); font-size: 12px; }
  main { padding: 22px; max-width: 1340px; margin: 0 auto; }

  /* ---------- 卡片 / 表格 ---------- */
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 18px; overflow: hidden;
  }
  .card > h2 {
    margin: 0; padding: 14px 18px; font-size: 14px; font-weight: 600;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .card > h2 .spacer { flex: 1; }
  .card .body { padding: 16px 18px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat .k { color: var(--text-dim); font-size: 12px; }
  .stat .v { font-size: 24px; font-weight: 650; margin-top: 4px; letter-spacing: -.5px; }
  .stat .v.warn { color: var(--warn); }
  .stat .v.danger { color: var(--danger); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--text-dim); font-weight: 550; font-size: 12px; background: #fafbfc; white-space: nowrap; }
  tbody tr:hover { background: #fafbfc; }
  td.key { font-family: var(--mono); font-size: 12.5px; }
  td.num { font-variant-numeric: tabular-nums; }
  .empty { padding: 34px; text-align: center; color: var(--text-dim); }

  /* ---------- 控件 ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border); background: #fbfcfd; }
  input, select, textarea {
    font: inherit; color: var(--text); background: #fff;
    border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 7px 10px; outline: none; min-width: 0;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  input[type="datetime-local"] { min-width: 210px; }
  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  label.field > input, label.field > select, label.field > textarea { width: 100%; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .search-input { width: 240px; }

  button {
    font: inherit; cursor: pointer; border-radius: 8px;
    border: 1px solid var(--border-strong); background: #fff; color: var(--text);
    padding: 7px 13px; transition: .12s;
  }
  button:hover { background: #f3f5f7; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.primary:hover { filter: brightness(1.07); }
  button.danger { color: var(--danger); border-color: #f3c0bb; background: #fff; }
  button.danger:hover { background: var(--danger-soft); }
  button.ghost { border-color: transparent; background: transparent; color: var(--brand); padding: 4px 6px; }
  button.ghost:hover { background: var(--brand-soft); }
  button.tiny { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tabs button {
    border: none; background: transparent; border-radius: 0; padding: 9px 14px;
    color: var(--text-dim); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 550; }
  .tabs button:hover { background: transparent; color: var(--text); }
  .tabs button.on:hover { color: var(--brand); }

  /* ---------- 徽标 ---------- */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 550; white-space: nowrap; }
  .b-ok { background: var(--ok-soft); color: var(--ok); }
  .b-warn { background: var(--warn-soft); color: var(--warn); }
  .b-danger { background: var(--danger-soft); color: var(--danger); }
  .b-off { background: #f1f3f5; color: var(--text-dim); }
  .b-info { background: var(--brand-soft); color: var(--brand); }

  /* ---------- 模态 ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(16,24,40,.42); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    background: var(--panel); border-radius: 14px; width: 560px; max-width: 100%;
    max-height: 90vh; overflow: auto; box-shadow: 0 20px 48px rgba(16,24,40,.22);
  }
  .modal h3 { margin: 0; padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 15px; }
  .modal .body { padding: 18px 20px; }
  .modal .foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; background: #fbfcfd; }

  /* ---------- 提示 ---------- */
  #toast { position: fixed; right: 20px; bottom: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: #1c2024; color: #fff; padding: 10px 15px; border-radius: 9px;
    font-size: 13px; box-shadow: 0 8px 24px rgba(16,24,40,.24); max-width: 380px;
    animation: pop .18s ease-out;
  }
  .toast.err { background: var(--danger); }
  .toast.ok { background: var(--ok); }
  @keyframes pop { from { transform: translateY(6px); opacity: 0 } }

  code.inline { font-family: var(--mono); background: #f1f3f5; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .keybox { font-family: var(--mono); font-size: 14px; background: var(--brand-soft); border: 1px dashed #b9cdfb; color: #1e40af; padding: 12px; border-radius: 8px; word-break: break-all; line-height: 1.9; }

  /* ---------- 授权码复制 ---------- */
  .keylist { display: flex; flex-direction: column; gap: 8px; }
  .keyrow {
    display: flex; align-items: center; gap: 8px;
    background: var(--brand-soft); border: 1px dashed #b9cdfb;
    border-radius: 8px; padding: 8px 8px 8px 11px;
  }
  .keyrow code {
    flex: 1; min-width: 0;
    font-family: var(--mono); font-size: 13.5px; color: #1e40af;
    word-break: break-all; letter-spacing: .01em;
  }
  .keyrow > button { flex: 0 0 auto; background: #fff; }
  .copy-hint { font-size: 12px; color: var(--text-dim); margin-top: 10px; }
  /* 复制成功后的短暂反馈态 */
  button.done { color: var(--ok); border-color: #b7e4c7; background: var(--ok-soft); }
  .muted { color: var(--text-dim); }
  .nowrap { white-space: nowrap; }

  /* 表格容器：超宽时横向滚动，不做内容挤压 */
  #licTableWrap, #prodTableWrap, #auditTableWrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* 行内操作按钮组：桌面横排不换行，窄屏（见下方媒体查询）转 flex 自动换行 */
  .acts { white-space: nowrap; }
  .acts > button { margin-right: 6px; }

  /* 分页条：授权码可能上千条，必须能翻页，不能只拉前 N 条 */
  .pager { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .pager .info { color: var(--text-dim); font-size: 13px; }
  .pager .spacer { flex: 1 1 auto; }
  .pager button { min-height: 34px; padding: 0 14px; }
  .pager button[disabled] { opacity: .45; cursor: not-allowed; }
  .acts > button:last-child { margin-right: 0; }

  /* 审计详情：桌面单行截断，窄屏展开 */
  td.detail { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ============================================================
     移动端适配
     ≤760px：表格转卡片、工具栏单列、模态改底部抽屉
     pointer:coarse：放大触控目标到 40px 以上
     ============================================================ */
  @media (max-width: 760px) {

    /* ---- 顶栏：隐藏服务端时间，收回两侧留白 ---- */
    header.top { height: 52px; padding: 0 12px; gap: 8px; }
    header.top .logo { font-size: 14px; }
    header.top .who { display: none; }          /* 375px 放不下，进「概览」看更合适 */
    header.top .badge { font-size: 11px; }

    main { padding: 12px 10px calc(24px + env(safe-area-inset-bottom)); }

    /* ---- 概览卡：3 列紧凑排布，一屏内看完 ---- */
    .stats {
      grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
      gap: 8px; margin-bottom: 14px;
    }
    .stat { padding: 10px 11px; border-radius: 9px; }
    .stat .k { font-size: 11px; line-height: 1.35; }
    .stat .v { font-size: 18px; margin-top: 2px; }

    /* ---- Tab：三等分，整块可点 ---- */
    .tabs { margin-bottom: 12px; }
    .tabs button { flex: 1; padding: 10px 0; text-align: center; }

    /* ---- 工具栏：全部单列，去掉 fixed width ---- */
    .toolbar { padding: 10px 12px; gap: 8px; }
    .toolbar > select,
    .toolbar > input { flex: 1 1 100%; width: 100%; }
    .toolbar > .spacer { display: none; }
    .toolbar > button { flex: 1 1 100%; }

    /* ---- 表单控件：16px 防 iOS 聚焦自动缩放 ---- */
    input, select, textarea { font-size: 16px; padding: 9px 11px; }
    input[type="datetime-local"] { min-width: 0; }
    .row2 { grid-template-columns: 1fr; gap: 0; }

    /* ---- 表格 → 卡片（每行展开为「标签: 值」） ---- */
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { border-bottom: 1px solid var(--border); padding: 6px 0; }
    tr:last-child { border-bottom: 0; }
    tbody tr:hover { background: transparent; }

    td { border: 0; padding: 5px 13px; text-align: left; }
    td::before {
      content: attr(data-label);
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 1px;
      letter-spacing: .02em;
    }
    td:not([data-label])::before { display: none; }

    /* 首列当卡片标题，不再重复显示标签 */
    td.cell-title { padding: 6px 13px 4px; font-size: 14px; font-weight: 600; }
    td.cell-title.key { font-size: 12.5px; font-weight: 500; }

    td.key { font-size: 12.5px; word-break: break-all; }
    td.cell-wrap { word-break: break-word; overflow-wrap: anywhere; }
    td.detail {
      max-width: none; white-space: normal;
      word-break: break-word; overflow-wrap: anywhere;
      font-family: var(--mono); font-size: 12px; line-height: 1.5;
    }
    .acts { display: flex; flex-wrap: wrap; gap: 6px; white-space: normal; margin-top: 3px; }
    .acts > button { margin-right: 0; }

    /* ---- 登录：小屏不撑破 ---- */
    #login { padding: 20px 16px; }
    #login .card { padding: 24px 20px; }

    /* ---- 模态 → 底部抽屉 ---- */
    .overlay { padding: 0; align-items: flex-end; overscroll-behavior: contain; }
    .modal {
      width: 100%; max-width: 100%;
      border-radius: 16px 16px 0 0;
      max-height: 92vh;
      max-height: 92dvh;              /* 键盘弹出时跟随可视视口收缩 */
      display: flex; flex-direction: column;
      overflow: hidden;               /* 滚动交给 .body，避免双滚动条 */
      overscroll-behavior: contain;
    }
    .modal h3 { padding: 14px 16px; flex: 0 0 auto; }
    .modal .body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px 20px; }
    .modal .foot {
      flex: 0 0 auto;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }
    .modal .foot button { flex: 1; padding: 11px; }

    /* ---- 提示条：贴满宽度，避开 home indicator ---- */
    #toast { left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); }
    .toast { max-width: none; }

    /* ---- 分页条：375px 下四个按钮 + 一行统计，统计独占一行 ---- */
    .pager { gap: 8px; margin-top: 12px; }
    .pager .info { flex: 1 1 100%; text-align: center; order: -1; font-size: 12.5px; }
    .pager .spacer { display: none; }
    .pager button { flex: 1 1 0; min-width: 0; min-height: 40px; padding: 0 6px; font-size: 12.5px; }
  }

  /* 触屏设备统一放大点击热区（不区分断点，iPad 也生效） */
  @media (pointer: coarse) {
    button { min-height: 40px; padding: 9px 14px; }
    button.tiny { min-height: 34px; padding: 7px 11px; font-size: 12.5px; }
    button.ghost { min-height: 34px; }
    .tabs button { min-height: 44px; }
    input, select { min-height: 40px; }
  }
</style>
</head>
<body>

<!-- ================= 登录 ================= -->
<div id="login">
  <div class="card">
    <h1>License Guard</h1>
    <p>输入管理口令以继续</p>
    <label class="field">
      <span>管理口令（ADMIN_TOKEN）</span>
      <input id="loginToken" type="password" placeholder="部署时 wrangler secret put ADMIN_TOKEN 的值" autocomplete="current-password" />
    </label>
    <button class="primary" style="width:100%" id="loginBtn">登录</button>
    <div class="hint" style="margin-top:12px">口令只保存在本机浏览器，服务端仅保存其哈希比对结果。</div>
  </div>
</div>

<!-- ================= 主界面 ================= -->
<div id="app" style="display:none">
  <header class="top">
    <div class="logo">License Guard</div>
    <span class="badge b-info" id="envBadge">--</span>
    <div class="spacer"></div>
    <span class="who" id="srvTime"></span>
    <button class="tiny" id="refreshBtn">刷新</button>
    <button class="tiny" id="logoutBtn">退出</button>
  </header>

  <main>
    <div class="stats" id="stats"></div>

    <div class="tabs">
      <button data-tab="lic" class="on">授权码</button>
      <button data-tab="prod">软件 / 产品</button>
      <button data-tab="audit">审计日志</button>
    </div>

    <!-- ---------- 授权码 ---------- -->
    <section id="tab-lic">
      <div class="card">
        <div class="toolbar">
          <select id="fProduct"><option value="">全部软件</option></select>
          <select id="fStatus">
            <option value="">全部状态</option>
            <option value="active">正常</option>
            <option value="suspended">暂停</option>
            <option value="revoked">吊销</option>
          </select>
          <input id="fQuery" class="search-input" placeholder="搜索授权码 / 客户 / 备注" />
          <button id="searchBtn">查询</button>
          <div class="spacer" style="flex:1"></div>
          <button class="primary" id="newLicBtn">+ 生成授权码</button>
        </div>
        <div id="licTableWrap"></div>
        <div id="licPager" class="pager"></div>
      </div>
    </section>

    <!-- ---------- 产品 ---------- -->
    <section id="tab-prod" style="display:none">
      <div class="card">
        <h2>软件列表 <span class="spacer"></span><button class="primary tiny" id="newProdBtn">+ 新增软件</button></h2>
        <div id="prodTableWrap"></div>
      </div>
    </section>

    <!-- ---------- 审计 ---------- -->
    <section id="tab-audit" style="display:none">
      <div class="card">
        <h2>审计日志 <span class="spacer"></span><button class="tiny" id="auditRefresh">刷新</button></h2>
        <div id="auditTableWrap"></div>
      </div>
    </section>
  </main>
</div>

<div id="toast"></div>
<div id="modals"></div>

<script>
/* ================================================================
   License Guard 管理后台（零依赖，纯前端）
   ================================================================ */
(function () {
  "use strict";

  var API = "/admin/api";
  var TIMER = null;
  var CUR_LICENSE = null;
  var CACHE = { products: [], licenses: [], stats: null };

  /* ---------------------------- 基础 ---------------------------- */

  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(tag, attrs, html) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (html !== undefined) n.innerHTML = html;
    return n;
  }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  /* 用于把多行文本塞进 data-* 属性：换行转实体，避免被解析器折叠 */
  function attr(s) { return esc(s).replace(/\r\n?/g, "&#10;"); }
  function toast(msg, kind) {
    var t = el("div", { class: "toast" + (kind ? " " + kind : "") }, esc(msg));
    $("#toast").appendChild(t);
    setTimeout(function () { t.remove(); }, kind === "err" ? 5200 : 3000);
  }
  function token() { return localStorage.getItem("lg_admin_token") || ""; }

  /* ---------------------------- 剪贴板 ---------------------------- */

  /* 老 API 兜底：非 HTTPS / 非 localhost 下 navigator.clipboard 不存在，
     部分安卓 WebView 也存在但不生效，因此保留 execCommand('copy') 通路。 */
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    /* 定位到视口内 1px 处并透明，避免 iOS 聚焦时弹键盘、页面跳动 */
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;outline:0;opacity:0;";
    document.body.appendChild(ta);

    var sel = document.getSelection();
    var prev = sel && sel.rangeCount > 0 ? sel.getRangeAt(0) : null;
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, text.length);   /* iOS 必须显式设范围 */
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    if (prev && sel) { sel.removeAllRanges(); sel.addRange(prev); }   /* 还原用户原有选区 */
    return ok;
  }

  /* 返回 Promise<boolean>。必须在 click 事件同步栈内调用（Safari 用户手势要求）。 */
  function copyText(text) {
    text = String(text === null || text === undefined ? "" : text);
    if (!text) return Promise.resolve(false);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        return navigator.clipboard.writeText(text)
          .then(function () { return true; })
          .catch(function () { return legacyCopy(text); });
      } catch (e) { /* 同步抛错（无安全上下文）直接走兜底 */ }
    }
    return Promise.resolve(legacyCopy(text));
  }

  /* 复制 + 提示 + 按钮短暂反馈。失败时退到「手动复制」弹窗而不是只报个错。 */
  function copyAndToast(text, btn, okMsg) {
    return copyText(text).then(function (ok) {
      if (!ok) {
        toast("自动复制被浏览器拒绝，已打开手动复制", "err");
        manualCopy(text);
        return false;
      }
      toast(okMsg || "已复制到剪贴板", "ok");
      if (btn && btn.classList) {
        var old = btn.textContent;
        btn.textContent = "已复制";
        btn.classList.add("done");
        btn.disabled = true;
        setTimeout(function () {
          btn.textContent = old;

  /* 最后兜底：文本预选中，用户按 Ctrl/⌘+C 或长按「拷贝」即可。
     常见于内网 http 部署（无 Clipboard API）与部分安卓 WebView。 */
  function manualCopy(text) {
    openModal("手动复制",
      '<p class="muted" style="margin-top:0">浏览器拒绝了自动写入剪贴板。文本已选中，按 <b>Ctrl / ⌘ + C</b> 复制；手机上长按选择「拷贝」。</p>' +
      '<textarea rows="4" readonly style="width:100%;font-family:var(--mono);font-size:13px;line-height:1.6">' +
        esc(text) + "</textarea>",
      null, "关闭");

  function api(path, method, body) {
    var opt = { method: method || "GET", headers: {} };
    if (token()) opt.headers["Authorization"] = "Bearer " + token();
    if (body !== undefined) {
      opt.headers["Content-Type"] = "application/json";
      opt.body = JSON.stringify(body);
    }
    return fetch(API + path, opt).then(function (r) {
      return r.json().catch(function () { return { ok: false, code: "PARSE", message: "响应解析失败" }; })
        .then(function (j) {
          if (!j.ok) {
            var e = new Error(j.message || "请求失败");
            e.code = j.code;
            throw e;
          }
          return j.data;
        });
    });
  }

  /* ---------------------------- 时间 ---------------------------- */

  function fmtLocal(ts) {
    if (!ts) return "永久";
    var d = new Date(ts * 1000);
    var p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
           p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function toInputValue(ts) {
    if (!ts) return "";
    var d = new Date(ts * 1000);
    var p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" +
           p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function fromInputValue(v) {
    if (!v) return null;
    var t = new Date(v).getTime();
    return isNaN(t) ? null : Math.floor(t / 1000);
  }
  function daysLeft(ts) {
    if (!ts) return null;
    return Math.ceil((ts * 1000 - Date.now()) / 86400000);
  }
  function expiryCell(row, product) {
    var aexp = row.expires_at !== null ? row.expires_at : (product ? product.default_expires_at : null);
    if (!aexp) return '<span class="badge b-info">永久</span>';
    var grace = row.grace_days !== null ? row.grace_days : (product ? product.default_grace_days : 0);
    var d = daysLeft(aexp);
    var cls = d < 0 ? "b-danger" : d <= 7 ? "b-warn" : "b-ok";
    var label = d < 0 ? ("已过期 " + Math.abs(d) + " 天") : (d + " 天后");
    return '<div class="nowrap">' + esc(fmtLocal(aexp)) + '</div>' +
           '<span class="badge ' + cls + '">' + esc(label) + '</span>' +
           (grace > 0 ? ' <span class="muted" style="font-size:11.5px">宽限' + grace + '天</span>' : '');
  }
  function statusBadge(s) {
    if (s === "active") return '<span class="badge b-ok">正常</span>';
    if (s === "suspended") return '<span class="badge b-warn">暂停</span>';
    if (s === "revoked") return '<span class="badge b-danger">吊销</span>';
    return '<span class="badge b-off">' + esc(s) + "</span>";
  }
  function productOf(id) {
    for (var i = 0; i < CACHE.products.length; i++) if (CACHE.products[i].id === id) return CACHE.products[i];
    return null;
  }

  /* ---------------------------- 授权码 ---------------------------- */

  /* 分页状态。后端 /admin/api/licenses 支持 limit/offset 并返回 total，
     前端之前写死 limit=200 且没有翻页入口 —— 超过 200 条就看不到了。 */
  var PAGE_SIZE = 50;
  var PAGE = { offset: 0, total: 0 };

  function loadLicenses() {
    var qs = [];
    if ($("#fProduct").value) qs.push("product_id=" + encodeURIComponent($("#fProduct").value));
    if ($("#fStatus").value) qs.push("status=" + encodeURIComponent($("#fStatus").value));
    if ($("#fQuery").value.trim()) qs.push("q=" + encodeURIComponent($("#fQuery").value.trim()));
    qs.push("limit=" + PAGE_SIZE);
    qs.push("offset=" + PAGE.offset);

    return api("/licenses?" + qs.join("&")).then(function (res) {
      CACHE.licenses = res.items;
      PAGE.total = Number(res.total || 0);
      if (res.server_time) {
        $("#srvTime").textContent = "服务端 " + new Date(res.server_time * 1000).toLocaleString();
      }
      // 删掉当前页最后一条后本页会空，自动退回上一页，避免停在空白页
      if (!res.items.length && PAGE.offset > 0) {
        PAGE.offset = Math.max(0, PAGE.offset - PAGE_SIZE);
        return loadLicenses();
      }
      if (!res.items.length) {
        $("#licTableWrap").innerHTML = '<div class="empty">没有符合条件的授权码</div>';
        renderPager(0);
        return null;
      }
      $("#licTableWrap").innerHTML =
        '<table><thead><tr>' +
          "<th>授权码</th><th>软件</th><th>客户 / 备注</th><th>到期</th><th>设备</th><th>状态</th><th style=\"width:1%\">操作</th>" +
        "</tr></thead><tbody>" +
        res.items.map(function (l) {
          var prod = productOf(l.product_id);
          return '<tr data-id="' + esc(l.id) + '">' +
            '<td class="cell-title key">' + esc(l.key_display) + "</td>" +
            '<td data-label="软件">' + esc(prod ? prod.name : l.product_id) + "</td>" +
            '<td class="cell-wrap" data-label="客户 / 备注">' + esc(l.customer || "-") + (l.note ? '<div class="muted" style="font-size:12px">' + esc(l.note) + "</div>" : "") + "</td>" +
            '<td data-label="到期">' + expiryCell(l, prod) + "</td>" +
            '<td class="num" data-label="设备">' + esc(l.activation_count || 0) + " / " + esc((l.max_devices !== null && l.max_devices !== undefined) ? l.max_devices : (prod ? prod.max_devices : 1)) + "</td>" +
            '<td data-label="状态">' + statusBadge(l.status) + "</td>" +
            '<td class="acts" data-label="操作">' +
              '<button class="tiny" data-copy="' + esc(l.id) + '">复制</button>' +
              '<button class="tiny" data-edit="' + esc(l.id) + '">改到期</button>' +
              '<button class="tiny" data-devices="' + esc(l.id) + '">设备</button>' +
              '<button class="tiny" data-toggle="' + esc(l.id) + '">' + (l.status === "active" ? "停用" : "启用") + "</button>" +
              '<button class="tiny danger" data-del="' + esc(l.id) + '">删除</button>' +
            "</td></tr>";
        }).join("") + "</tbody></table>";
      renderPager(res.items.length);
      return res;
    });

  /** 渲染分页条。total 由后端返回，是本条件下的总条数，不是本页条数。 */
  function renderPager(shown) {
    var el = $("#licPager");
    if (!el) return;
    var total = PAGE.total;
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    var page = Math.floor(PAGE.offset / PAGE_SIZE) + 1;

    if (!total) {
      el.innerHTML = '<span class="info">共 0 条</span>';
      return;
    }
    el.innerHTML =
      '<span class="info">共 ' + total + ' 条 · 第 ' + page + " / " + pages + " 页（本页 " + shown + " 条）</span>" +
      '<span class="spacer"></span>' +
      '<button class="tiny" data-page="first"' + (page <= 1 ? " disabled" : "") + '>&laquo; 首页</button>' +
      '<button class="tiny" data-page="prev"' + (page <= 1 ? " disabled" : "") + ">&lsaquo; 上一页</button>" +
      '<button class="tiny" data-page="next"' + (page >= pages ? " disabled" : "") + ">下一页 &rsaquo;</button>" +
      '<button class="tiny" data-page="last"' + (page >= pages ? " disabled" : "") + ">末页 &raquo;</button>";
  }

  /** 翻页。which: first | prev | next | last */
  function gotoPage(which) {
    var pages = Math.max(1, Math.ceil(PAGE.total / PAGE_SIZE));
    var page = Math.floor(PAGE.offset / PAGE_SIZE) + 1;
    var target = page;
    if (which === "first") target = 1;
    else if (which === "prev") target = page - 1;
    else if (which === "next") target = page + 1;
    else if (which === "last") target = pages;
    target = Math.min(Math.max(target, 1), pages);
    if (target === page) return;
    PAGE.offset = (target - 1) * PAGE_SIZE;
    loadLicenses().catch(function (e) { toast(e.message, "err"); });
  }

          '<input type="datetime-local" id="eExp" value="' + esc(toInputValue(l.expires_at)) + '" /></label>' +
        '<div class="row2">' +
          '<label class="field"><span>预设：从今天起</span><select id="ePreset">' +
            '<option value="">不改</option>' +
            '<option value="7">7 天后</option><option value="30">30 天后</option>' +
            '<option value="90">90 天后</option><option value="365">1 年后</option>' +
            '<option value="0">永久</option>' +
          "</select></label>" +
          '<label class="field"><span>宽限天数（空 = 继承）</span><input type="number" id="eGrace" min="0" value="' + esc(l.grace_days === null ? "" : l.grace_days) + '" /></label>' +
        "</div>" +
        '<div class="row2">' +
          '<label class="field"><span>设备数上限（空 = 继承）</span><input type="number" id="eDev" min="1" value="' + esc(l.max_devices === null ? "" : l.max_devices) + '" /></label>' +
          '<label class="field"><span>状态</span><select id="eStatus">' +
            '<option value="active"' + (l.status === "active" ? " selected" : "") + ">正常</option>" +
            '<option value="suspended"' + (l.status === "suspended" ? " selected" : "") + ">暂停</option>" +
            '<option value="revoked"' + (l.status === "revoked" ? " selected" : "") + ">吊销（永久失效）</option>" +
          "</select></label>" +
        "</div>" +
        '<div class="row2">' +
          '<label class="field"><span>客户</span><input id="eCust" value="' + esc(l.customer || "") + '" /></label>' +
          '<label class="field"><span>备注</span><input id="eNote" value="' + esc(l.note || "") + '" /></label>' +
        "</div>";

      openModal("设置到期时间", html, function () {
        var preset = $("#ePreset").value;
        var payload = {
          grace_days: $("#eGrace").value === "" ? null : Number($("#eGrace").value),
          max_devices: $("#eDev").value === "" ? null : Number($("#eDev").value),
          status: $("#eStatus").value,
          customer: $("#eCust").value.trim() || null,
          note: $("#eNote").value.trim() || null
        };
        if (preset !== "") {
          if (preset === "0") payload.expires_at = null;
          else payload.expires_in_days = Number(preset);
        } else {
          payload.expires_at = fromInputValue($("#eExp").value);
        }
        api("/licenses/" + id, "PATCH", payload).then(function () {
          toast("已更新", "ok");
          closeModal();
          refreshAll();
        }).catch(function (e) { toast(e.message, "err"); });
      });
    }).catch(function (e) { toast(e.message, "err"); });
  }

  /* --- 设备管理 --- */
  function showDevices(id) {
    api("/licenses/" + id + "/activations").then(function (acts) {
      var html = acts.length
        ? '<table><thead><tr><th>机器码</th><th>设备名</th><th>平台</th><th>最后在线</th><th></th></tr></thead><tbody>' +
          acts.map(function (a) {
            return "<tr>" +
              '<td class="cell-title key" title="' + esc(a.machine_id) + '">' + esc(String(a.machine_id).slice(0, 16)) + "…</td>" +
              '<td data-label="设备名">' + esc(a.machine_name || "-") + "</td>" +
              '<td data-label="平台">' + esc(a.platform || "-") + "</td>" +
              '<td class="nowrap" data-label="最后在线">' + esc(fmtLocal(a.last_seen_at)) + "</td>" +
              '<td class="acts" data-label="操作"><button class="tiny danger" data-unbind="' + esc(a.id) + '">解绑</button></td></tr>';
          }).join("") + "</tbody></table>"
        : '<div class="empty">该授权码还没有激活任何设备</div>';
      html += '<div style="margin-top:14px"><button class="danger" id="resetAll">清空全部设备（释放设备位）</button></div>';

      openModal("已激活设备", html, null, "关闭");
      CUR_LICENSE = id;
      var rb = document.getElementById("resetAll");
      if (rb) rb.onclick = function () {
        api("/licenses/" + id + "/reset", "POST", {}).then(function (r) {
          toast("已清空 " + r.cleared + " 台设备", "ok");
          closeModal();
          loadLicenses();
        }).catch(function (e) { toast(e.message, "err"); });
      };
    }).catch(function (e) { toast(e.message, "err"); });
  }

  /* ---------------------------- 审计 ---------------------------- */

  function loadAudit() {
    return api("/audit?limit=200").then(function (rows) {
      $("#auditTableWrap").innerHTML = rows.length
        ? '<table><thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>目标</th><th>详情</th><th>IP</th></tr></thead><tbody>' +
          rows.map(function (r) {
            return "<tr>" +
              '<td class="cell-title nowrap">' + esc(fmtLocal(r.ts)) + "</td>" +
              '<td data-label="操作者">' + esc(r.actor || "-") + "</td>" +
              '<td data-label="动作"><code class="inline">' + esc(r.action) + "</code></td>" +
              '<td class="key" data-label="目标">' + esc(r.target || "-") + "</td>" +
              '<td class="muted detail" data-label="详情">' + esc(r.detail || "-") + "</td>" +
              '<td data-label="IP">' + esc(r.ip || "-") + "</td></tr>";
          }).join("") + "</tbody></table>"
        : '<div class="empty">暂无日志</div>';
    });
  }

  /* ---------------------------- 模态 ---------------------------- */

  function openModal(title, html, onOk, okText) {
    var wrap = $("#modals");
    wrap.innerHTML = "";
    var ov = el("div", { class: "overlay" });
    var m = el("div", { class: "modal" });
    m.appendChild(el("h3", null, esc(title)));
    var b = el("div", { class: "body" });
    b.innerHTML = html;
    m.appendChild(b);

    if (onOk) {
      var foot = el("div", { class: "foot" });
      var cancel = el("button", null, "取消");
      cancel.onclick = closeModal;
      var okb = el("button", { class: "primary" }, esc(okText || "确定"));
      okb.onclick = function () { onOk(); };
      foot.appendChild(cancel);
      foot.appendChild(okb);
      m.appendChild(foot);
    } else {
      var foot2 = el("div", { class: "foot" });
      var close = el("button", { class: "primary" }, esc(okText || "关闭"));
      close.onclick = closeModal;
      foot2.appendChild(close);
      m.appendChild(foot2);
    }

    ov.appendChild(m);
    ov.addEventListener("click", function (e) { if (e.target === ov) closeModal(); });
    wrap.appendChild(ov);
  }
  function closeModal() { $("#modals").innerHTML = ""; }
  window.closeModal = closeModal;

  /* ---------------------------- 事件委托 ---------------------------- */

  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("button") : null;
    if (!t) return;
    var d = t.dataset;

    /* 复制类按钮优先级最高：都是纯前端动作，不发请求 */
    if (d.copy) {
      var lic = CACHE.licenses.filter(function (x) { return x.id === d.copy; })[0];
      if (!lic) return toast("该授权码已不在当前列表中，请刷新", "err");
      return copyAndToast(lic.key_display, t, "授权码已复制");
    }
    /* 翻页按钮 */
    if (d.page) return gotoPage(d.page);

    if (d.copyKey) return copyAndToast(d.copyKey, t, "已复制");

    if (d.edit) return editLicense(d.edit);
    if (d.devices) return showDevices(d.devices);

    if (d.unbind) {
      api("/activations/" + d.unbind, "DELETE").then(function () {
        toast("已解绑", "ok");
        if (CUR_LICENSE) showDevices(CUR_LICENSE);
        loadLicenses();
      }).catch(function (e2) { toast(e2.message, "err"); });
      return;
    }

    if (d.toggle) {
      var row = CACHE.licenses.filter(function (x) { return x.id === d.toggle; })[0];
      if (!row) return;
      var next = row.status === "active" ? "suspended" : "active";
      api("/licenses/" + d.toggle, "PATCH", { status: next }).then(function () {
        toast(next === "active" ? "已启用" : "已停用", "ok");
        refreshAll();
      }).catch(function (e2) { toast(e2.message, "err"); });
      return;
    }

    if (d.del) {
      if (!confirm("删除后无法恢复，且使用该授权码的客户端会立即失效。确定删除？")) return;
      api("/licenses/" + d.del, "DELETE").then(function () {
        toast("已删除", "ok");
        refreshAll();
      }).catch(function (e2) { toast(e2.message, "err"); });
      return;
    }

    if (d.editProd) {
      var p = productOf(d.editProd);
      return productForm(p);
    }

    if (d.delProd) {
      if (!confirm("删除软件会同时删除其下所有授权码，确定？")) return;
      api("/products/" + d.delProd, "DELETE").then(function () {
        toast("已删除", "ok");
        refreshAll();
      }).catch(function (e2) { toast(e2.message, "err"); });
      return;
    }
  });

  $("#newProdBtn").onclick = function () { productForm(null); };
  /* 筛选项变化一律回到第一页：换条件后当前 offset 多半越界 */
  $("#searchBtn").onclick = function () { PAGE.offset = 0; loadLicenses(); };
  $("#fProduct").onchange = function () { PAGE.offset = 0; loadLicenses(); };
  $("#fStatus").onchange = function () { PAGE.offset = 0; loadLicenses(); };
  $("#fQuery").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { PAGE.offset = 0; loadLicenses(); }
  });

  /* ---------------------------- 启动 ---------------------------- */

  function refreshAll() {
    return Promise.all([loadStats(), loadProducts()]).then(function () { return loadLicenses(); });
  }

  function boot() {
    api("/me").then(function (m) {
      $("#login").style.display = "none";
      $("#app").style.display = "";
      $("#envBadge").textContent = m.env;
      refreshAll().catch(function (e) { toast(e.message, "err"); });
      if (TIMER) clearInterval(TIMER);
      TIMER = setInterval(function () {
        if (document.visibilityState === "visible") loadStats();
      }, 60000);
    }).catch(function () {
      localStorage.removeItem("lg_admin_token");
      $("#login").style.display = "flex";
      $("#app").style.display = "none";
    });
  }

  if (token()) boot();
})();
</script>
</body>
</html>
